# The dataset, its terms and its releases (STANDARD.md §2.1, §8).
# Schema: PublicDataToolkit/schema/dataset.schema.json. Edited by hand.
standard_version: "0.1"
id: pisa
kind: survey
title: "Programme for International Student Assessment (PISA), student questionnaire"
publisher:
  name: "Organisation for Economic Co-operation and Development (OECD)"
  url: "https://www.oecd.org/en/about/programmes/pisa.html"
url: "https://webfs.oecd.org/pisa2022/index.html"
description: >-
  The OECD's assessment of 15-year-old students in reading, mathematics and science, with
  a student questionnaire, every three years since 2000 (2022 was delayed a year). Each
  cycle is its own database. This repo covers the student questionnaire file of the 2012,
  2015, 2018 and 2022 cycles.
# Terms are decided by a person, never by an agent or this template (STANDARD.md §8).
terms:
  url: "https://www.oecd.org/en/about/terms-conditions.html"
  summary: >
    OECD Terms and Conditions: data may be extracted, downloaded, copied, adapted, printed, distributed, shared and embedded for any purpose, even commercial, with credit to the OECD using the dataset's citation. Written content published since 1 July 2024 is CC BY 4.0; earlier written content may be used, copied, distributed and adapted with citation, but commercial translation needs authorisation. Allen Downey decided on 2026-11-19 that data, documentation and metadata ship and that LLM processing is allowed, with an OECD credit as the notice.
  notice: "Source: OECD, PISA database (2012, 2015, 2018 and 2022 student questionnaire data files). Cite each dataset as the OECD asks."
  data: ship
  documentation: ship
  metadata: ship
  llm_processing: allowed
  reviewed_by: Allen Downey
  reviewed_on: "2026-11-19"
design:
  weights: [W_FSTUWT]
  replicates:
    prefix: W_FSTURWT
    n: 80
    method: fay
    note: >-
      The data files label them "FINAL TRIMMED NONRESPONSE ADJUSTED STUDENT REPLICATE
      BRR-FAY WEIGHTS n". Fay's factor isn't in the sources here (the technical reports,
      which give it, are behind a bot check), so `fay_factor` is left out.
  note: >-
    W_FSTUWT is the "FINAL TRIMMED NONRESPONSE ADJUSTED STUDENT WEIGHT". Variance comes from
    the replicate weights, not from strata and PSUs, so `strata` and `psu` are left out.
    2012 names its replicates W_FSTR1-80 (its release overrides this). The replicate weights
    are the group `<release>.replicate-weights`, and the plausible values (PV1READ-PV10READ;
    PV1READ-PV5READ in 2012) the group `<release>.pv-read`.
data_rows:
  column: CNT
  in: [USA, GBR, DEU, JPN]
dimensions:
  wave:
    label: "cycle"
    note: The assessment year. Each cycle is one release, so a release holds one wave.
  form:
    label: "questionnaire form"
    column: QuestID
    codes: {"1": "A", "2": "B", "3": "C", "5": "UH"}
    note: >-
      2012 only: the student questionnaire rotated three forms (A, B, C) and a short one-hour
      form (UH); QuestID says which a student had. The sense-of-belonging question (ST87) is
      on forms B and C.
releases:
  - id: "2012"
    label: "PISA 2012 Database"
    status: superseded
    sources: [pisa2012-sas-control, pisa2012-spss-control, nces-pisa2012-stu-questionnaire-a,
              nces-pisa2012-stu-questionnaire-b, nces-pisa2012-stu-questionnaire-c]
    design:
      weights: [W_FSTUWT]
      replicates:
        prefix: W_FSTR
        n: 80
        method: fay
        note: Labelled "FINAL STUDENT REPLICATE BRR-FAY WEIGHT n" in the SAS control file.
    tables:
      - id: student
        label: "Student questionnaire data file (INT_STU12_DEC03.txt)"
        description: >-
          Fixed-width text laid out by the SAS control file. The common-format file here
          holds four countries' rows only (`data_rows`).
        sources: [pisa2012-stu]
        key: [CNT, SCHOOLID, StIDStd]
  - id: "2015"
    label: "PISA 2015 Database"
    status: superseded
    sources: [pisa2015-codebook, nces-pisa2015-stu-questionnaire, pisa-data-files-page]
    tables:
      - id: student
        label: "Student questionnaire data file (CY6_MS_CMB_STU_QQQ.sav)"
        description: >-
          The common-format file here holds four countries' rows only (`data_rows`).
        sources: [pisa2015-stu]
        key: [CNTSTUID]
  - id: "2018"
    label: "PISA 2018 Database"
    status: superseded
    sources: [pisa2018-codebook, nces-pisa2018-stu-questionnaire, pisa-data-files-page]
    tables:
      - id: student
        label: "Student questionnaire data file (CY07_MSU_STU_QQQ.sav)"
        description: >-
          The common-format file here holds four countries' rows only (`data_rows`).
        sources: [pisa2018-stu]
        key: [CNTSTUID]
  - id: "2022"
    label: "PISA 2022 Database"
    status: current
    sources: [pisa2022-codebook, pisa2022-stu-questionnaire, pisa-data-files-page]
    tables:
      - id: student
        label: "Student questionnaire data file (CY08MSP_STU_QQQ.SAV)"
        description: >-
          The common-format file here holds four countries' rows only (`data_rows`).
        sources: [pisa2022-stu]
        key: [CNTSTUID]
