# Scaled indices, estimated afresh in each cycle. A same-named index is linked across cycles
# only as `rescaled`, and only where a source says it was rescaled: for ESCS, the OECD's data
# files page lists "Rescaled indices of economic, social and cultural status (ESCS) for use
# with the PISA 2012, 2015 and 2018 datasets". No source here says so of BELONG.
rescaled: {ESCS: pisa-data-files-page, BELONG: null}

# How each kind of variable was produced, and what its values are (STANDARD.md §4.1).
kinds:
  id:         {variable_type: administrative, measure: identifier}
  form:       {variable_type: administrative, measure: categorical}
  weight:     {variable_type: weight, measure: weight}
  replicate:  {variable_type: weight, measure: weight}
  sex:        {variable_type: recode, measure: categorical}
  grade:      {variable_type: recode, measure: ordinal}
  belonging:  {variable_type: response, measure: ordinal}
  index:      {variable_type: computed, measure: continuous}
  pv:         {variable_type: computed, measure: continuous}
