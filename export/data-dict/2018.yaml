  Publisher: Organisation for Economic Co-operation and Development (OECD) (https://www.oecd.org/en/about/programmes/pisa.html)

  Release `2018`: PISA 2018 Database (current)

  Terms of use: https://www.oecd.org/en/about/terms-conditions.html

  Exported by the PublicDataToolkit library 0.2.2 from this repository's records (`metadata/`), which are canonical and hold what data-dict can't: missing-code types, availability, wording by wave, corrections, provenance, groups and links. See LOSSES.md.
