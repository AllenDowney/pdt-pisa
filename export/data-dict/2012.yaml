name: pisa
label: Programme for International Student Assessment (PISA), student questionnaire
description: The OECD's assessment of 15-year-old students in reading, mathematics and science, with a
  student questionnaire, every three years since 2000 (2022 was delayed a year). Each cycle is its own
  database. This repo covers the student questionnaire file of the 2012, 2015, 2018 and 2022 cycles.
details: |
  Publisher: Organisation for Economic Co-operation and Development (OECD) (https://www.oecd.org/en/about/programmes/pisa.html)

  Release `2012`: PISA 2012 Database (superseded)

  Terms of use: https://www.oecd.org/en/about/terms-conditions.html

  Exported by the PublicDataToolkit library 0.2.1 from this repository's records (`metadata/`), which are canonical and hold what data-dict can't: missing-code types, availability, wording by wave, corrections, provenance, groups and links. See LOSSES.md.
